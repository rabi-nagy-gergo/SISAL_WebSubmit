name: CI

# ==========================================
# Triggers
# ==========================================
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

# Cancel older in-progress runs on the same branch/PR when new commits arrive.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ==========================================
  # JOB 1: Lint
  # Fast, native (non-Dockerized) check of the FastAPI backend source.
  # The legacy AutoQC script (wb_check_v15.py) is intentionally excluded,
  # since its calculation/validation logic must not be touched or reshaped.
  # ==========================================
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff check (src/ only, excluding legacy AutoQC script)
        run: |
          ruff check src \
            --exclude "src/services/wb_check_v15.py"

      - name: Run ruff format check (src/ only, excluding legacy AutoQC script)
        run: |
          ruff format --check src \
            --exclude "src/services/wb_check_v15.py"

  # ==========================================
  # JOB 2: Test
  # Runs the existing pytest suite inside the actual DEBUG Docker image
  # ==========================================
  test:
    name: Test (dockerized pytest)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      # docker-compose.debug.yml / .env.debug are required by `make test`.
      # We create minimal placeholder env files here so the compose build
      # succeeds; no real secrets are needed to run the test suite.
      - name: Create placeholder .env files
        run: |
          touch .env
          echo "APP_PORT=8000" >> .env

          touch .env.debug
          {
            echo "ENVIRONMENT=development"
            echo "SESSION_TIMEOUT_HOURS=2.0"
            echo "SAVED_SESSION_TIMEOUT_HOURS=168.0"
            echo "SESSIONS_DIR=sessions"
            echo "AUTOQC_SCRIPT_PATH=src/services/wb_check_v15.py"
            echo "R_PLOT_SCRIPT_PATH=src/services/run_plots.R"
          } >> .env.debug

          touch .env.release
          {
            echo "ENVIRONMENT=production"
            echo "SESSION_TIMEOUT_HOURS=2.0"
            echo "SAVED_SESSION_TIMEOUT_HOURS=168.0"
            echo "SESSIONS_DIR=sessions"
            echo "AUTOQC_SCRIPT_PATH=src/services/wb_check_v15.py"
            echo "R_PLOT_SCRIPT_PATH=src/services/run_plots.R"
          } >> .env.release

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Speeds up repeated CI runs by caching Docker layers between workflow runs.
      - name: Run test suite (make test)
        run: make test

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage-output/coverage.xml
          fail_ci_if_error: true

      - name: Tear down containers
        if: always()
        run: make down

  # ==========================================
  # JOB 3: Build
  # Verifies both the DEBUG and RELEASE Docker images actually build successfully.
  # ==========================================
  build:
    name: Build (debug + release images)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Create placeholder .env files
        run: |
          touch .env
          echo "APP_PORT=8000" >> .env

          touch .env.debug
          {
            echo "ENVIRONMENT=development"
            echo "SESSION_TIMEOUT_HOURS=2.0"
            echo "SAVED_SESSION_TIMEOUT_HOURS=168.0"
            echo "SESSIONS_DIR=sessions"
            echo "AUTOQC_SCRIPT_PATH=src/services/wb_check_v15.py"
            echo "R_PLOT_SCRIPT_PATH=src/services/run_plots.R"
          } >> .env.debug

          touch .env.release
          {
            echo "ENVIRONMENT=production"
            echo "SESSION_TIMEOUT_HOURS=2.0"
            echo "SAVED_SESSION_TIMEOUT_HOURS=168.0"
            echo "SESSIONS_DIR=sessions"
            echo "AUTOQC_SCRIPT_PATH=src/services/wb_check_v15.py"
            echo "R_PLOT_SCRIPT_PATH=src/services/run_plots.R"
          } >> .env.release

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build DEBUG image
        run: docker compose -f docker-compose.yml -f docker-compose.debug.yml build

      - name: Build RELEASE image
        run: docker compose -f docker-compose.yml -f docker-compose.release.yml build

      - name: Report build status
        run: echo "Both DEBUG and RELEASE images built successfully."
