<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Validation - SISAL Web Submit</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/stepper.css" rel="stylesheet">
    <link href="css/validate.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-4 py-md-5">
    <div class="row justify-content-center">
        <div class="col-lg-10">
            <div id="stepper-container" class="mb-4 mb-md-5"></div>
            
            <div class="card border-0 rounded-3">
                <div class="card-body p-4 p-md-5">
                    <div class="text-center mb-4">
                        <h3 class="fw-bold text-primary">Step 2: Validation</h3>
                        <p class="text-muted">Review the results of Python AutoQC.</p>
                    </div>
                    
                    <div id="validation-spinner" class="text-center py-4 py-md-5">
                        <div class="spinner-border text-primary" role="status"></div>
                        <p class="mt-3">Running AutoQC script... Please wait.</p>
                    </div>
                    
                    <div id="validation-results" class="d-none">
                        <div id="status-alert" class="alert" role="alert"></div>

                        <div class="accordion mt-4" id="validationAccordion">
                            
                            <div class="accordion-item border-0 mb-4 rounded panel-map d-none" id="map-container">
                                <h2 class="accordion-header" id="headingMap">
                                    <button class="accordion-button map-btn rounded" type="button" data-bs-toggle="collapse" data-bs-target="#collapseMap" aria-expanded="true" aria-controls="collapseMap">
                                        Regional Site Map
                                    </button>
                                </h2>
                                <div id="collapseMap" class="accordion-collapse collapse show" aria-labelledby="headingMap">
                                    <div class="accordion-body p-3 text-center">
                                        <img id="site-map-img" src="" alt="Regional Site Map" class="img-fluid rounded" style="max-height: 500px; border: 1px solid #0f5132;">
                                    </div>
                                </div>
                            </div>

                            <div class="accordion-item border-0 mb-4 rounded panel-info">
                                <h2 class="accordion-header" id="headingInfo">
                                    <button class="accordion-button info-btn rounded" type="button" data-bs-toggle="collapse" data-bs-target="#collapseInfo" aria-expanded="true" aria-controls="collapseInfo">
                                        Informative Messages
                                    </button>
                                </h2>
                                <div id="collapseInfo" class="accordion-collapse collapse show" aria-labelledby="headingInfo">
                                    <div class="accordion-body p-3">
                                        <div class="table-responsive">
                                            <table class="table table-bordered mb-0" id="table-informative">
                                                <thead>
                                                    <tr>
                                                        <th>Priority</th>
                                                        <th>Description</th>
                                                        <th>Script location</th>
                                                        <th>Workbook location</th>
                                                    </tr>
                                                </thead>
                                                <tbody></tbody>
                                            </table>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <div class="accordion-item border-0 mb-3 rounded panel-danger">
                                <h2 class="accordion-header" id="headingDanger">
                                    <button class="accordion-button danger-btn rounded" type="button" data-bs-toggle="collapse" data-bs-target="#collapseDanger" aria-expanded="true" aria-controls="collapseDanger">
                                        Warnings and Errors
                                    </button>
                                </h2>
                                <div id="collapseDanger" class="accordion-collapse collapse show" aria-labelledby="headingDanger">
                                    <div class="accordion-body p-3">
                                        <div class="table-responsive">
                                            <table class="table table-bordered mb-0" id="table-warnings">
                                                <thead>
                                                    <tr>
                                                        <th>Priority</th>
                                                        <th>Description</th>
                                                        <th>Script location</th>
                                                        <th>Workbook location</th>
                                                    </tr>
                                                </thead>
                                                <tbody></tbody>
                                            </table>
                                        </div>
                                    </div>
                                </div>
                            </div>

                        </div> 
                        </div>
                    
                    <div class="d-flex justify-content-between mt-4 mt-md-5 pt-3 pt-md-4 border-top">
                        <button class="btn btn-outline-secondary btn-lg nav-btn" id="btn-back-1">&larr; Back</button>
                        <button class="btn btn-primary btn-lg nav-btn" id="btn-next-3" disabled>Next &rarr;</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/shared.js"></script>
<script src="js/stepper.js"></script>
<script src="js/validate.js"></script>
</body>
</html>
