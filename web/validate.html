<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Validation - SISAL Web Submit</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/stepper.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-10">
            <div id="stepper-container" class="mb-5"></div>

            <div class="card shadow-sm border-0 rounded-3">
                <div class="card-body p-5">
                    
                    <div class="text-center mb-4">
                        <h3 class="fw-bold text-primary">Step 2: Validation</h3>
                        <p class="text-muted">Review the results of Python AutoQC.</p>
                    </div>
                    
                    <div id="validation-spinner" class="text-center py-5">
                        <div class="spinner-border text-primary" role="status"></div>
                        <p class="mt-3">Running AutoQC script... Please wait.</p>
                    </div>

                    <div id="validation-results" class="d-none">
                        <div id="status-alert" class="alert" role="alert"></div>

                        <h5 class="mt-4">Informative messages</h5>
                        <ul class="list-group mb-4" id="list-informative"></ul>

                        <h5 class="mt-4">Warnings and Errors</h5>
                        <div class="table-responsive">
                            <table class="table table-bordered table-striped" id="table-warnings">
                                <thead class="table-danger">
                                    <tr><th>Error description</th></tr>
                                </thead>
                                <tbody></tbody>
                            </table>
                        </div>
                    </div>

                    <div class="d-flex justify-content-between mt-5 pt-4 border-top">
                        <button class="btn btn-outline-secondary btn-lg px-4" id="btn-back-1">Back</button>
                        <button class="btn btn-primary btn-lg px-5" id="btn-next-3" disabled>Next</button>
                    </div>

                </div>
            </div>

        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/shared.js"></script>
<script src="js/stepper.js"></script>
<script src="js/validate.js"></script>
</body>
</html>
