<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload - SISAL Web Submit</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/stepper.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container py-4 py-md-5">
    <div class="row justify-content-center">
        <div class="col-lg-10">
            <div id="stepper-container" class="mb-4 mb-md-5"></div>

            <div class="card shadow-sm border-0 rounded-3">
                <div class="card-body p-4 p-md-5">
                    
                    <div class="text-center mb-4 mb-md-5">
                        <h3 class="fw-bold text-primary">Step 1: Upload</h3>
                        <p class="text-muted">Select your SISAL v15 Excel workbook to begin the validation process.</p>
                    </div>

                    <div class="mb-3 text-start">
                        <input class="form-control form-control-lg" type="file" id="fileInput" accept=".xlsx">
                        <div id="previous-file-info" class="form-text text-success d-none mt-2">
                            Previously uploaded file: <strong id="previous-filename"></strong>
                        </div>
                        <div class="mt-2 text-danger d-none" id="upload-error">Please select a file!</div>
                    </div>

                    <div class="d-flex justify-content-end mt-4 mt-md-5 pt-3 pt-md-4 border-top">
                        <button class="btn btn-primary btn-lg nav-btn" id="btn-upload">Upload file &rarr;</button>
                    </div>

                </div>
            </div>
            
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/shared.js"></script>
<script src="js/stepper.js"></script>
<script src="js/upload.js"></script>
</body>
</html>
