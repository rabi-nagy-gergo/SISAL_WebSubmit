<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <base href="{{ root_path }}/">
    <title>Upload - SISAL Web Submit</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/stepper.css?v={{ app_version }}" rel="stylesheet">
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
</head>
<body class="bg-light d-flex flex-column min-vh-100">

<div class="container py-4 py-md-5 flex-grow-1">
    <div class="row justify-content-center">
        <div class="col-lg-10">
            <div id="stepper-container" class="mb-4 mb-md-5"></div>

            <div class="card shadow-sm border-0 rounded-3">
                <div class="card-body p-4 p-md-5">
                    
                    <div class="text-center mb-4 mb-md-5">
                        <h3 class="fw-bold text-primary">Step 1: Upload</h3>
                        <p class="text-muted">Select your SISAL v15 Excel workbook to begin the validation process.</p>
                    </div>

                    <div id="captcha-container" class="d-none mb-4 text-center d-flex justify-content-center">
                        <div class="cf-turnstile" data-sitekey="0x4AAAAAAEc9CFkOFDq8Wylj" data-theme="light" data-language="en" data-callback="onCaptchaSuccess"></div>
                    </div>

                    <div id="upload-section" class="d-none">
                        <div class="mb-3 text-start">
                            <input class="form-control form-control-lg" type="file" id="fileInput" accept=".xlsx">
                            <div id="previous-file-info" class="form-text text-success d-none mt-2">
                                Previously uploaded file: <strong id="previous-filename"></strong>
                            </div>
                            <div class="mt-2 text-danger d-none" id="upload-error">Please select a file!</div>
                        </div>

                        <div class="alert alert-danger mt-4 mb-0 d-none" id="upload-server-error" role="alert"></div>

                        <div class="d-flex justify-content-end mt-4 mt-md-5 pt-3 pt-md-4 border-top">
                            <button class="btn btn-primary btn-lg nav-btn" id="btn-upload">Upload file &rarr;</button>
                        </div>
                    </div>

                </div>
            </div>
            
        </div>
    </div>
</div>

<footer class="mt-auto py-2 bg-dark text-light">
    <div class="container d-flex justify-content-between align-items-center small">
        
        <div class="text-start" style="flex: 1;">
            <a href="about.html" class="btn btn-outline-light btn-sm">About this project</a>
        </div>
        
        <div class="text-center" style="flex: 1;">
            &copy; 2026 SISAL Web Submit<br>
            <span class="text-white-50">For v15.0 excel workbooks</span>
        </div>
        
        <div class="text-end" style="flex: 1;">
            Developed by: <strong>Gergő Rabi-Nagy</strong>
        </div>
        
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/shared.js?v={{ app_version }}"></script>
<script src="js/stepper.js?v={{ app_version }}"></script>
<script src="js/upload.js?v={{ app_version }}"></script>
</body>
</html>
