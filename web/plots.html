<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plots - SISAL Web Submit</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/stepper.css" rel="stylesheet">
    <link href="css/plots.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-4 py-md-5">
    <div class="row justify-content-center">
        <div class="col-lg-10">
            <div id="stepper-container" class="mb-4 mb-md-5"></div>

            <div class="card border-0 rounded-3">
                <div class="card-body p-4 p-md-5">
                    <div class="text-center mb-4">
                        <h3 class="fw-bold text-primary">Step 3: Age-Model &amp; Proxy Plots</h3>
                        <p class="text-muted">Review the age-model and proxy time-series plots generated by the R script.</p>
                    </div>

                    <div id="plots-spinner" class="text-center py-4 py-md-5">
                        <div class="spinner-border text-primary" role="status"></div>
                        <p class="mt-3">Running R plotting script... Please wait.</p>
                    </div>

                    <div id="plots-results" class="d-none">
                        <div id="plots-status-alert" class="alert" role="alert"></div>

                        <div class="accordion mt-4" id="plotsAccordion"></div>
                    </div>

                    <div class="d-flex justify-content-between mt-4 mt-md-5 pt-3 pt-md-4 border-top">
                        <button class="btn btn-outline-secondary btn-lg nav-btn" id="btn-back-2">&larr; Back</button>
                        <button class="btn btn-primary btn-lg nav-btn" id="btn-next-4" disabled>Next &rarr;</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/shared.js"></script>
<script src="js/stepper.js"></script>
<script src="js/plots.js"></script>
</body>
</html>
